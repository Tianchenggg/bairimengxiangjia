<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c7a67f">
  <meta name="description" content="在木桌上挑一张纸牌，翻开九箱对局。两个人轮流翻牌和当银行家，先扣下自己的牌，每翻开一张其他牌，对方都可报价或跳过，最后揭晓奖金差额。">
  <title>白日梦想家 · 九箱双人局</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/table.webp">
  <link rel="preload" as="image" href="assets/slip.webp">
  <link rel="preload" as="font" type="font/woff" href="assets/number.woff" crossorigin>
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" href="moments.css?v=3">
  <script defer src="game.js?v=4"></script><script defer src="audio.js"></script>
  <script defer src="moments.js?v=3"></script><script defer src="ui.js?v=5"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="sound" viewBox="0 0 24 24"><path d="m2.8 9 4.3.2 5-4 .1 13.9-5.1-4-4.4-.3zM16 8.4q3.8 3.6.2 7.1m2.7-10q6.2 6.6.2 13"/></symbol>
    <symbol id="mute" viewBox="0 0 24 24"><path d="m2.8 9 4.3.2 5-4 .1 13.9-5.1-4-4.4-.3zM16 9.2l5.7 6.1m.1-6.1-5.8 6"/></symbol>
    <symbol id="restart-i" viewBox="0 0 24 24"><path d="M3.5 11a8.5 8.5 0 1 1 2 7M3 4.5v6.8h6.6"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m5.4 6.2 13.3 12M18.1 5.8 5.7 18.6"/></symbol>
    <symbol id="chev" viewBox="0 0 24 24"><path d="m5 9 7 6 7-6"/></symbol>
    <symbol id="star" viewBox="0 0 24 24"><path d="m12.9 2 1.6 7.5 7.5-.9-5.7 5.2 3 7.2-7.1-3.8-6.6 4.7 1.8-8L2 9.5l8 .5z"/></symbol>
  </svg>
  <div class="wood" aria-hidden="true"></div>
  <div class="tabletop">
    <header class="table-header">
      <div class="title-wrap"><div class="title-slip"><h1>白日梦想家</h1><svg class="title-line" viewBox="0 0 240 12" aria-hidden="true"><path d="M4 7Q76 0 232 5M43 10q97-6 171-2"/></svg></div><span class="tape title-tape"></span></div>
      <nav aria-label="游戏设置"><button id="audio" class="paper-tool" type="button" aria-pressed="true"><svg class="icon"><use href="#sound"/></svg><span>音效开</span></button><button id="reset-match" class="paper-tool" type="button" hidden><svg class="icon"><use href="#restart-i"/></svg><span>重开</span></button></nav>
    </header>
    <main class="playmat" id="playmat">
      <section class="play-area" aria-label="桌上的纸牌">
        <div id="arena" class="card-grid"></div>
      </section>
      <div class="desk-side">
        <section id="negotiation" class="bid-sheet" aria-label="对局操作" hidden></section>
      <aside class="side" aria-labelledby="ledger-title">
        <div id="ledger" class="ledger-wrap"><div class="ledger-page"></div><div class="ledger-writing">
          <div class="ledger-head"><h2 id="ledger-title">剩余奖励</h2><span id="pool-count"></span><button id="pool-toggle" class="ledger-toggle" aria-expanded="false" aria-controls="ledger-content" aria-label="展开剩余奖励"><svg class="icon"><use href="#chev"/></svg></button></div>
          <div id="ledger-content"><div id="grand"></div><ul id="prizes"></ul></div>
        </div><span class="tape ledger-tape"></span></div>
        <img class="pencil" src="assets/pencil.webp" alt="" draggable="false">
      </aside>
      </div>
    </main>
  </div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="paper"></div></dialog>
</body>
</html>
